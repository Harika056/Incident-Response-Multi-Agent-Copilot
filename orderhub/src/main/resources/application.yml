server:
  port: 8080

spring:
  application:
    name: orderhub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderhub}
    username: ${DB_USER:orderhub}
    password: ${DB_PASSWORD:orderhub}
    hikari:
      maximum-pool-size: 10
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

orderhub:
  admin-token: ${ORDERHUB_ADMIN_TOKEN:dev-admin-token}
  topic: orders.created
  consumer-group: orderhub-inventory

# Log line format parsed by copilot/diagnostics.py:  ts|LEVEL|logger|message
logging:
  file:
    name: ${LOG_FILE:./logs/orderhub.log}
  pattern:
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}|%level|%logger{20}|%msg%n"
