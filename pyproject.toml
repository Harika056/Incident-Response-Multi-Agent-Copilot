[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-response-copilot"
version = "0.1.0"
description = "Human-in-the-loop multi-agent incident-response copilot for OrderHub (Google ADK + MCP)"
requires-python = ">=3.11"
dependencies = [
  "google-adk[db]>=2.15",
  "mcp>=2.3",
  "kafka-python>=3.0",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "PyJWT>=2.8",
  "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
copilot = "copilot.run:main"

[tool.setuptools.packages.find]
include = ["copilot*", "eval*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
